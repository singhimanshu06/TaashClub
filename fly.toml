# fly.toml app configuration file generated for taashclub on 2026-07-24T19:43:20+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# IMPORTANT: This app stores room/player state in process memory (RoomManager
# in backend/app/game/room.py). It MUST run as a single machine — multiple
# machines would each have their own in-memory state and return "room not
# found" for rooms created on a different instance. After any deploy or config
# change, verify with `fly scale count 1` to prevent Fly from maintaining
# extra machines.

app = 'taashclub'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/docs'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
